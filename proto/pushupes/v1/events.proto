syntax = "proto3";

package pushupes.v1;

option go_package = "pushupes/internal/grpcapi/pushupes/v1;pushupesv1";

// EventService is the client-facing data plane: event writes and event
// queries, served on its own port, independent of the HTTP admin/replication
// plane. Semantics mirror the JSON API (DESIGN.md): command_id idempotency,
// version = tail+1, reads observe <=HW, MOVED/ASK redirects carry the
// authoritative slot + node.
service EventService {
  // Append appends one record to one aggregate stream.
  rpc Append(AppendRequest) returns (AppendResponse);
  // BatchAppend appends many records in one call. Every record carries its
  // own result (success/exists/fail) in request order; records sharing an
  // aggregate_id within one batch are all failed (the batch must hold
  // distinct aggregate ids), other streams are unaffected. The server
  // executes one slot at a time serially and different slots concurrently.
  rpc BatchAppend(BatchAppendRequest) returns (BatchAppendResponse);
  // ReadStream reads a version range of one aggregate stream.
  rpc ReadStream(ReadStreamRequest) returns (ReadStreamResponse);
  // ReadTails reports the latest version of many aggregates in one call.
  rpc ReadTails(ReadTailsRequest) returns (ReadTailsResponse);
  // ReadByCommand looks one record up by command_id (idempotency probe).
  rpc ReadByCommand(ReadByCommandRequest) returns (ReadByCommandResponse);
  // ReadVersionByTime reports the highest version whose record has
  // unix_time less than or equal to the requested time — the anchor a
  // client uses to replay history as of a point in time (it then reads
  // from that version with ReadStream).
  rpc ReadVersionByTime(ReadVersionByTimeRequest) returns (ReadVersionByTimeResponse);
}

message Event {
  string type = 1;
  bytes body = 2; // raw payload bytes (no JSON/base64 layering)
}

// Record is one stored event-stream entry.
message Record {
  string aggregate_id = 1;
  uint32 version = 2;
  int64 unix_time = 3;
  string command_id = 4;
  repeated Event events = 5;
  uint64 seq = 6; // slot sequence
}

message AppendRequest {
  string aggregate_id = 1;
  uint32 version = 2; // must be stream tail + 1
  int64 unix_time = 3; // 0 = server clock
  string command_id = 4; // idempotency key
  repeated Event events = 5;
  reserved 6; // append success always means: high watermark covers it
}

message AppendResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_SUCCESS = 1;
    STATUS_EXISTS = 2; // idempotent duplicate; record carries the stored entry
    STATUS_FAIL = 3;
  }
  Status status = 1;
  uint32 err_id = 2; // wire error table: 1001 conflict, 1003 MOVED, 1004 ASK...
  string message = 3;
  uint32 current_version = 4; // set on 1001 for client self-heal
  uint64 seq = 5;
  int32 slot = 6; // routing slot (authoritative even on redirects)
  string node = 7; // redirect target "host:port" for MOVED/ASK/NOT_LEADER
  Record record = 8; // set on STATUS_EXISTS only (the stored duplicate)
}

// BatchAppendRequest carries a batch of appends. No size cap: the only bound
// is the gRPC message limit, which the operator configures
// (-grpc-max-msg-size, default 4MiB). An empty batch returns empty results.
message BatchAppendRequest {
  repeated AppendRequest records = 1;
}

// BatchAppendResult pairs one aggregate with its append outcome.
// aggregate_id echoes the request field so a result can be identified without
// positional assumptions; response mirrors single Append exactly
// (status/err_id/current_version/seq/slot/node/record).
message BatchAppendResult {
  string aggregate_id = 1;
  AppendResponse response = 2;
}

// BatchAppendResponse answers one result per request record, in the SAME
// ORDER as BatchAppendRequest.records.
message BatchAppendResponse {
  repeated BatchAppendResult results = 1;
}

message ReadStreamRequest {
  string aggregate_id = 1;
  uint32 from_version = 2; // 0 = 1
  uint64 limit = 3; // 0 = all
}

message ReadStreamResponse {
  repeated Record records = 1;
  uint32 next_version = 2;
  uint32 last_version = 3;
}

// ReadTailsRequest asks for the latest version of each listed aggregate.
message ReadTailsRequest {
  repeated string aggregate_ids = 1;
}

// ReadTailsResponse answers with one version per requested aggregate, in the
// SAME ORDER as the request: versions[i] is the tail of aggregate_ids[i], and
// 0 means that aggregate has no records in the slot the answering node holds.
//
// This is the bulk form of "does version k exist" probing: a resume scan needs
// one number per aggregate, and one RPC per aggregate made the scan cost grow
// with the number of streams. The bound is the same one ReadStream applies —
// the answering node's own durable LEO (never a stale former-leader
// watermark), same as ReadStream.
message ReadTailsResponse {
  repeated uint32 versions = 1;
}

message ReadByCommandRequest {
  string aggregate_id = 1;
  string command_id = 2;
}

message ReadByCommandResponse {
  bool found = 1;
  Record record = 2;
}

// ReadVersionByTimeRequest asks for the point-in-time version anchor of one
// aggregate: the highest version whose record carries unix_time less than or
// equal to unix_time (a record stamped exactly at the queried time is the
// answer). A stream with no record visible at or before that time answers 0.
message ReadVersionByTimeRequest {
  string aggregate_id = 1;
  int64 unix_time = 2;
}

message ReadVersionByTimeResponse {
  uint32 version = 1; // 0 = no record visible at or before the time
}
