syntax = "proto3";

package pushupes.v1;

option go_package = "github.com/berkaroad/pushupes/pkg/grpcapi/pushupes/v1;pushupesv1";

// EventService is the client-facing data plane: event writes and event
// queries, served on its own port, independent of the HTTP admin/replication
// plane. Semantics mirror the JSON API (DESIGN.md): command_id idempotency,
// version = tail+1, reads observe <=HW, MOVED/ASK redirects carry the
// authoritative slot + node.
service EventService {
  // BatchAppend appends records in one call — the only write entry on the
  // client plane; a single write is a batch of one record. Every record
  // carries its own result (success/exists/fail) in request order; records
  // sharing an aggregate_id within one batch are all failed (the batch must
  // hold distinct aggregate ids), other streams are unaffected. The server
  // executes one slot at a time serially and different slots concurrently.
  rpc BatchAppend(BatchAppendRequest) returns (BatchAppendResponse);
  // PrefetchRoutes hands out the whole write-routing table in one call, with
  // no request: every node answers from its Raft-replicated slot table (no
  // forwarding, no leader requirement). Clients call it once at startup and
  // refresh periodically; a write's MOVED/ASK answer patches the cached row
  // for that slot in between. The answer is a hint — append correctness never
  // depends on this table being current.
  rpc PrefetchRoutes(PrefetchRoutesRequest) returns (PrefetchRoutesResponse);
  // ReadStream reads a version range of one aggregate stream.
  rpc ReadStream(ReadStreamRequest) returns (ReadStreamResponse);
  // ReadTails reports the latest version of many aggregates in one call.
  rpc ReadTails(ReadTailsRequest) returns (ReadTailsResponse);
  // ReadByCommand looks one record up by command_id (idempotency probe).
  rpc ReadByCommand(ReadByCommandRequest) returns (ReadByCommandResponse);
  // ReadVersionByTime reports the highest version whose record has
  // unix_time less than or equal to the requested time — the anchor a
  // client uses to replay history as of a point in time (it then reads
  // from that version with ReadStream).
  rpc ReadVersionByTime(ReadVersionByTimeRequest) returns (ReadVersionByTimeResponse);
}

// Compression states whether the event bodies of one record were already
// compressed by the writer before going on the wire. The values are the
// frame flags codec ids verbatim (0 raw, 1 gzip): what the writer stamps is
// exactly what the record header records. The server never inflates and
// never compresses — it validates the gzip magic, stamps the codec into the
// record-header flags byte, and persists the body bytes verbatim. Readers
// get the codec back on Record.compressed and decode in their client
// library.
enum Compression {
  COMPRESSION_UNSPECIFIED = 0; // absent means: store the bodies as given
  COMPRESSION_GZIP = 1; // every event body of the record is one gzip stream
}

message Event {
  string type = 1;
  bytes body = 2; // raw payload bytes (no JSON/base64 layering); a gzip
                  // stream when the record was appended with COMPRESSION_GZIP
}

// Record is one stored event-stream entry.
message Record {
  string aggregate_id = 1;
  uint32 version = 2;
  int64 unix_time = 3;
  string command_id = 4;
  repeated Event events = 5;
  uint64 seq = 6; // slot sequence
  bool compressed = 7; // event bodies carry a gzip stream (stored codec)
}

message AppendRequest {
  string aggregate_id = 1;
  uint32 version = 2; // must be stream tail + 1
  int64 unix_time = 3; // 0 = server clock
  string command_id = 4; // idempotency key
  repeated Event events = 5;
  reserved 6; // append success always means: high watermark covers it
  Compression compression = 7; // body codec as prepared by the writer
}

message AppendResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_SUCCESS = 1;
    STATUS_EXISTS = 2; // idempotent duplicate; record carries the stored entry
    STATUS_FAIL = 3;
  }
  Status status = 1;
  uint32 err_id = 2; // wire error table (pkg/client/errs.go): 1001 conflict, 1003 MOVED,
  // 1004 ASK, 1007 ack timeout, 1008 replica catching up, 1009 no data plane...
  string message = 3;
  uint32 current_version = 4; // set on 1001 for client self-heal
  uint64 seq = 5;
  int32 slot = 6; // routing slot (authoritative even on redirects)
  string node = 7; // redirect target "host:port" for MOVED (1003) / ASK (1004)
  Record record = 8; // set on STATUS_EXISTS only (the stored duplicate)
}

// BatchAppendRequest carries a batch of appends. No size cap: the only bound
// is the gRPC message limit, which the operator configures
// (-grpc-max-msg-size, default 4MiB). An empty batch returns empty results.
message BatchAppendRequest {
  repeated AppendRequest records = 1;
}

// BatchAppendResult pairs one aggregate with its append outcome.
// aggregate_id echoes the request field so a result can be identified without
// positional assumptions; response mirrors single Append exactly
// (status/err_id/current_version/seq/slot/node/record).
message BatchAppendResult {
  string aggregate_id = 1;
  AppendResponse response = 2;
}

// BatchAppendResponse answers one result per request record, in the SAME
// ORDER as BatchAppendRequest.records.
message BatchAppendResponse {
  repeated BatchAppendResult results = 1;
}

// PrefetchRoutesRequest carries nothing: the routing table is cluster-wide
// state, not a per-query answer.
message PrefetchRoutesRequest {}

// PrefetchRoutesResponse is the whole slot->node routing table plus the
// address book it indexes.
message PrefetchRoutesResponse {
  // node_client_addrs are the cluster members' client-plane ("host:port")
  // addrs, de-duplicated in first-appearance order.
  repeated string node_client_addrs = 1;
  // slot_node_index is DENSE over slots: index s is the slot-s leader's
  // position in node_client_addrs, for every s in 0..len-1. Its length is
  // the cluster's slot count — the value is cluster state and reaches the
  // client here, never as a client-side constant. Slots the answering node
  // cannot map to a live client_addr (unassigned, or a leader whose
  // registration has not landed yet) fall back to the answering node's own
  // entry, the same local-serve rule SubmitBatch applies to such slots, so
  // the array never has holes and needs no sentinel handling.
  repeated int32 slot_node_index = 2;
}

message ReadStreamRequest {
  string aggregate_id = 1;
  uint32 from_version = 2; // 0 = 1
  uint64 limit = 3; // 0 = all
}

message ReadStreamResponse {
  repeated Record records = 1;
  uint32 next_version = 2;
  uint32 last_version = 3;
  // Reads redirect like writes: a node that can neither serve the slot
  // (its leader, or a replica whose sync with the current epoch is proven)
  // nor answer it locally fails the read in-band — err_id 1003 (MOVED)
  // with the authoritative slot and the leader's client-plane node, and
  // no records. err_id 0 means this node answered. Clients refresh their
  // routing row from the answer and retry (pkg/client does this per call).
  uint32 err_id = 4;
  int32 slot = 5;
  string node = 6; // redirect target "host:port" when err_id is 1003
}

// ReadTailsRequest asks for the latest version of each listed aggregate.
message ReadTailsRequest {
  repeated string aggregate_ids = 1;
}

// ReadTailsResult is one aggregate's tail outcome: version when the answering
// node serves that slot (err_id 0), or a redirect — err_id 1003 (MOVED) plus
// the authoritative slot and the leader's client-plane node, version 0.
message ReadTailsResult {
  string aggregate_id = 1; // echo, like BatchAppendResult
  uint32 version = 2;
  uint32 err_id = 3;
  int32 slot = 4;
  string node = 5;
}

// ReadTailsResponse answers one result per requested aggregate, in the SAME
// ORDER as ReadTailsRequest.aggregate_ids, each echoing its aggregate_id
// (the BatchAppend protocol shape). This node only answers versions for the
// slots it can serve — its leaders and its proven-in-sync replicas; every
// other aggregate comes back as a per-entry 1003 with the leader's node.
// There is no server-side forwarding: the fan-out lives with the client,
// which groups by its own routing table (pkg/client ReadTails does this,
// mirroring BatchAppend's redirect re-send). A 0 version with err_id 0
// means the aggregate has no records within this node's visibility bound.
message ReadTailsResponse {
  repeated ReadTailsResult results = 1;
}

message ReadByCommandRequest {
  string aggregate_id = 1;
  string command_id = 2;
}

message ReadByCommandResponse {
  bool found = 1;
  Record record = 2;
  // Redirect in-band, exactly as ReadStreamResponse: err_id 1003 + slot +
  // the leader's client-plane node when this node cannot serve the slot.
  uint32 err_id = 3;
  int32 slot = 4;
  string node = 5;
}

// ReadVersionByTimeRequest asks for the point-in-time version anchor of one
// aggregate: the highest version whose record carries unix_time less than or
// equal to unix_time (a record stamped exactly at the queried time is the
// answer). A stream with no record visible at or before that time answers 0.
message ReadVersionByTimeRequest {
  string aggregate_id = 1;
  int64 unix_time = 2;
}

message ReadVersionByTimeResponse {
  uint32 version = 1; // 0 = no record visible at or before the time
  // Redirect in-band, exactly as ReadStreamResponse: err_id 1003 + slot +
  // the leader's client-plane node when this node cannot serve the slot.
  uint32 err_id = 2;
  int32 slot = 3;
  string node = 4;
}
