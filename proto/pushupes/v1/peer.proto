syntax = "proto3";

package pushupes.v1;

option go_package = "github.com/berkaroad/pushupes/internal/grpcapi/pushupes/v1;pushupesv1";

// PeerService is the inter-node data plane. It is served on the SAME port
// as the Raft transport (the peer port): the connection demux routes the
// HTTP/2 preface (first byte 'P') here and every other first byte to
// Raft. All node-to-node communication — replication fetch, LEO progress,
// commit-fence forwarding, liveness probing and address
// registration — rides this one gRPC surface; the admin port is
// management-only.
service PeerService {
  // Ping is the liveness probe (controller failover).
  rpc Ping(PingRequest) returns (PingResponse);
  // Register announces a node's admin/client addresses into the routing
  // table (leader commits an OpRegister; non-leaders relay).
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Adopt is a node announcing itself to the cluster it is joining: the node
  // is running but is not a voter yet, so it names itself (id + peer address)
  // and the leader adds it to the configuration. Without it a node started
  // after the cluster was formed would have to be typed into an operator's
  // admin call by hand. Non-leaders relay to the leader, like Register.
  rpc Adopt(AdoptRequest) returns (AdoptResponse);
  // MFetch is the multiplexed replica fetch: every slot this follower
  // copies from the serving leader is one item; the call long-polls when
  // everything is empty (wait_ms budget, server-held).
  rpc MFetch(MFetchRequest) returns (MFetchResponse);
  // ReplicaProgress reports follower LEOs in bulk after a productive round.
  rpc ReplicaProgress(ReplicaProgressRequest) returns (ReplicaProgressResponse);
  // Replicate pushes one leader-assigned record to the migration target
  // during the forwarding window (idempotent at seq).
  rpc Replicate(ReplicateRequest) returns (ReplicateResponse);
  // SlotLeo answers a single slot's log end offset (migration catch-up).
  rpc SlotLeo(SlotLeoRequest) returns (SlotLeoResponse);
  // FenceSlot is the migration commit fence: the source stops accepting new
  // appends for the slot (they block, they are never rejected), drains the
  // in-flight ones, pushes the frozen tail to the target and answers with the
  // frozen log end offset only once the target has confirmed it holds that
  // offset. The fence stays held until the leader move (or an abort) is
  // applied, and is force-released after a bound so a lost controller cannot
  // wedge the slot's writes.
  rpc FenceSlot(FenceSlotRequest) returns (FenceSlotResponse);
  // SlotLeader answers THIS node's local view of one slot: which node it
  // believes leads it and at which epoch. The migration source uses it to gate
  // the commit-fence release on the target having actually applied the leader
  // move — without it the source starts redirecting the moment IT applies the
  // move, and a client that then asks the not-yet-updated target is bounced
  // back to the source: an infinite MOVED/ASK ping-pong for the length of the
  // follower apply lag (clients with a small redirect budget fail).
  rpc SlotLeader(SlotLeaderRequest) returns (SlotLeaderResponse);
  // DropSlot discards this node's local copy of one slot and reopens it empty.
  // Used by the migration fence when a target's streams are inconsistent with
  // its LEO (DESIGN.md §1.1 rule 3): the increment that would repair it cannot
  // be shipped, because the seqs the missing versions need are already spent, so
  // the copy is rebuilt from the source instead. The caller owns the slot's
  // placement and must not be asking a node that serves it.
  rpc DropSlot(DropSlotRequest) returns (DropSlotResponse);
  // ReportUnreachable is a follower's evidence that a node it fetches slot
  // data from stopped answering at the transport level. It is sent to the
  // CONTROLLER (a follower's report is a witness, not a verdict): the
  // controller acts on a quorum of witnesses instead of waiting out its own
  // probe threshold. Best effort — a dropped report costs a probe round, and
  // the liveness sweep remains the fallback when nobody is watching.
  rpc ReportUnreachable(ReportUnreachableRequest) returns (ReportUnreachableResponse);
  // SlotLeos answers the durable LEO of many slots at once. The controller asks
  // it of every candidate before failing a node over: the failover must hand a
  // slot's leadership to a replica that HOLDS what was acknowledged, and only
  // the replicas themselves know their LEO (the slot table carries no offsets).
  // A slot this node does not hold reports 0.
  rpc SlotLeos(SlotLeosRequest) returns (SlotLeosResponse);
  // SlotSizes answers the on-disk size AND the seq ledger of many slots at
  // once, for the cluster storage gauges: the sums an operator watches count
  // each slot's LEADER copy (the copy the writes landed on), and only the
  // holder of a copy can report its bytes and its seq. A slot this node does
  // not hold answers 0 on both arrays.
  rpc SlotSizes(SlotSizesRequest) returns (SlotSizesResponse);
  // WatchLayout is the data-plane node's feed: a node running with
  // role=learner holds slot replicas but is not a voter (DESIGN §12), so it
  // takes the replicated metadata from here instead of running a Raft group.
  // Only the leader serves it (any voter answers with a REDIRECT frame naming
  // the leader, and the caller re-dials). The server side streams the state
  // machine's inputs — HELLO (leader, term, voter set, generation), ENTRY
  // (committed command), COMMIT (progress) and SNAPSHOT (rebuild-from-here) —
  // and closes the stream when the caller falls too far behind to keep in a
  // bounded buffer: the caller reconnects, reports what it applied, and is
  // either caught up incrementally or handed an image.
  rpc WatchLayout(WatchLayoutRequest) returns (stream LayoutFrame);
}

// WatchLayoutRequest names the caller and the point it resumes from.
message WatchLayoutRequest {
  string learner_id = 1;
  // from_index/from_term are the last point the caller APPLIED (0 when it has
  // nothing). The pair is checked against the log: a mismatch means the
  // caller's history is not this group's and it gets an image instead.
  uint64 from_index = 2;
  uint64 from_term = 3;
  // topology is the cluster generation the caller's local bytes belong to
  // (see internal/cluster/owner.go): the leader reports its own id, and a
  // differing value is how a node that kept its slot data across a rebuilt
  // consensus state learns that its copies need re-proving.
  string topology = 4;
}

// LayoutFrame is one step of the feed. kind selects which fields carry.
message LayoutFrame {
  uint32 kind = 1;
  uint64 index = 2;   // ENTRY/SNAPSHOT: the index this frame puts the caller at
  uint64 term = 3;    // ENTRY/SNAPSHOT: that index's term
  bytes data = 4;     // ENTRY: command payload; SNAPSHOT: state-machine image
  uint64 commit_index = 5;  // COMMIT: the leader's commit index
  string leader_id = 6;     // HELLO/REDIRECT
  string leader_peer_addr = 7;  // HELLO/REDIRECT: where to re-dial
  string topology = 8;   // HELLO: the leader's cluster generation id
  repeated LayoutVoter voters = 9;  // HELLO: the voter set (Members/PeerAddrs)
  uint64 first_index = 10;  // HELLO: lowest index the leader can still serve
  uint32 entry_kind = 11;   // ENTRY: Raft entry kind (command/noop/conf)
  string reason = 12;    // HELLO/REDIRECT: why this frame (operator-facing)
}

message LayoutVoter {
  string id = 1;
  string addr = 2;
}

message PingRequest {}
message PingResponse { string node = 1; }

// ReportUnreachableRequest names the observer and the node it could not reach.
// Both are node ids from the replicated directory (the controller validates
// them: an unknown or already-down suspect is ignored).
message ReportUnreachableRequest {
  string reporter = 1;
  string suspect = 2;
}
message ReportUnreachableResponse {}

// SlotLeos asks one node for its durable LEO of many slots (parallel arrays, as
// in MFetchRequest). Slots the node does not hold answer 0.
message SlotLeosRequest { repeated int32 slots = 1; }
message SlotLeosResponse {
  repeated int32 slots = 1;
  repeated uint64 leos = 2;
}

// SlotSizes asks one node for the on-disk bytes and the seq ledger of many
// slots (same parallel array shape; seqs[i] is that copy's record count, the
// same book as its durable-write counter). Slots it does not hold answer 0.
message SlotSizesRequest { repeated int32 slots = 1; }
message SlotSizesResponse {
  repeated int32 slots = 1;
  repeated uint64 bytes = 2;
  repeated uint64 seqs = 3;
}

message RegisterRequest {
  string id = 1;
  string admin_addr = 2;  // management HTTP base (scheme carried)
  string client_addr = 3; // client-facing gRPC base (scheme carried)
  string role = 4;        // self-announced place in the cluster, required:
                          // voter or learner
}
message RegisterResponse {}

// AdoptRequest is a node offering itself to the cluster. peer_addr is its
// consensus endpoint — the only address membership needs; admin/client
// addresses arrive later through the ordinary registration heartbeat.
message AdoptRequest {
  string id = 1;
  string peer_addr = 2;
  string role = 3; // the role to be admitted with, required: voter or
                   // learner
}
message AdoptResponse {}

// FetchItem: response entries only (requests use packed parallel arrays in
// MFetchRequest). ReplicaProgress reuses slot/from_seq for durable positions.
// payload is raw concatenated WAL record bytes (length-prefixed frames),
// never re-encoded.
message FetchItem {
  int32 slot = 1;
  uint64 from_seq = 2;
  uint64 next_seq = 3;
  bytes payload = 4;
}

message MFetchRequest {
  string follower = 1;
  int64 wait_ms = 2;
  // Packed parallel positions: slot[i] wanted from from_seqs[i].
  // Scalar arrays (not messages): a session carries every followed slot
  // each round, and per-entry FetchItem objects dominated the wire cost.
  repeated int32 slots = 3 [packed = true];
  repeated uint64 from_seqs = 4 [packed = true];
  // sweep marks the periodic liveness round: the leader refreshes the
  // replica last-seen stamps for EVERY reported position. Ordinary rounds
  // record only positions that actually moved (see progressBatch.stamp).
  bool sweep = 5;
}
message MFetchResponse {
  string follower = 1;
  repeated FetchItem items = 2;
  // hw_slots[i] / hw_values[i]: the round's HW ledger — the leader-side high
  // watermark for every slot the follower reported a position for this round
  // (the request's own owned set: idle rounds have no data items but the
  // ledger still flows). It seeds each replica's READ-ADMISSION bound: a
  // replica serves a slot locally only once its durable LEO reaches the
  // latest ledger hw for that slot at that slot's CURRENT epoch; until then
  // (a new seat catching up, a lagging copy, a node that just restarted) the
  // read proxies to the leader, so acknowledged data is never short-read on a
  // follower that has not synced. The bound cannot falsely admit: hw moves
  // only on reports that justify it, and an epoch change invalidates every
  // sample it produced.
  repeated int32 hw_slots = 3 [packed = true];
  repeated uint64 hw_values = 4 [packed = true];
}

message ReplicaProgressRequest {
  string follower = 1;
  // Packed durable positions (from_seq = LEO+1), same shape as MFetch.
  repeated int32 slots = 2 [packed = true];
  repeated uint64 from_seqs = 3 [packed = true];
  // stamp: refresh last-seen for every entry (liveness), not only moved
  // ones. False = record only positions that actually changed.
  bool stamp = 4;
}
// ReplicaProgressResponse echoes the HW ledger for every slot the request
// reported (the POST-report watermarks, after progressBatch.apply). This is
// the zero-lag channel of read admission: an append is acknowledged exactly
// when the last required replica report advances HW, and that report's own
// response carries the new watermark — the replica that completed the ack
// learns "seq N is confirmed" on the same round trip the client's SUCCESS
// rides on, so its local read never hides acknowledged data behind a stale
// sample. The MFetch ledger stays as the catch-up/baseline channel (a
// restarted or new-seat replica, and multi-replica sets where another seat's
// report moved HW: that seat catches up within one sweep round, ≤2s).
message ReplicaProgressResponse {
  repeated int32 hw_slots = 1 [packed = true];
  repeated uint64 hw_values = 2 [packed = true];
}

message ReplicateRequest {
  int32 slot = 1;
  uint64 seq = 2;
  bytes payload = 3; // one encoded record
}
message ReplicateResponse {}

message SlotLeoRequest {
  int32 slot = 1;
  // flush asks the holder to make the slot's outstanding records durable BEFORE
  // answering, and to report the offset that is on disk afterwards. The
  // migration commit fence uses it: a committed leader move is terminal, and the
  // source's copy stops being recoverable once it leaves the replica set — so on
  // a single-copy layout the target has to prove the frozen tail is durable, not
  // merely applied, or a target that died with the tail in its page cache would
  // lose writes the cluster already acknowledged.
  bool flush = 2;
}

// SlotLeoResponse answers a slot's log end offset plus a summary of its
// aggregate directory, so a caller can tell whether this node holds a slot
// whose stream state is CONSISTENT with what its LEO claims.
//
// leo alone is not enough: a node can sit at a high LEO while some aggregate's
// stream is shorter, because the records above it were appended without the
// directory adopting their versions (DESIGN.md §1.1 rule 3). Comparing LEOs is
// then satisfied while records exist that no reader can serve. The three
// counters below make that state detectable in the same round trip:
//
//   - aggregates: directory entries (one per aggregate the slot holds)
//   - versions:   sum of the claimed latest version over those entries
//   - resolvable: sum of the seqs the directory can actually resolve
//
// versions == resolvable means every claimed version has a resolvable seq, so
// nothing is stranded in the WAL. A caller that needs "this node really holds
// everything up to leo" must check that equality, not just the offset.
message SlotLeoResponse {
  uint64 leo = 1;
  uint64 aggregates = 2;
  uint64 versions = 3;
  uint64 resolvable = 4;
  // durable_leo answers SlotLeoRequest.flush: the log end offset that is on disk
  // after the flush (0 when the request did not ask for one).
  uint64 durable_leo = 5;
}

// FenceSlotRequest freezes one migrating slot on its source leader. The reply
// carries the frozen LEO the target has confirmed.
// target is the migration target the CONTROLLER committed to: the source
// ships its frozen tail there on the controller's explicit instruction,
// because the source's own table may still be catching up on the stage when
// the fence RPC lands (the controller awaits only its own apply). Empty
// target falls back to the source's table view.
message FenceSlotRequest { int32 slot = 1; string target = 2; }
message FenceSlotResponse { uint64 leo = 1; }

// SlotLeaderRequest asks a peer for its local placement view of one slot.
message SlotLeaderRequest { int32 slot = 1; }
// SlotLeaderResponse carries the peer's local leader ("" when unassigned) and
// the placement epoch, so the caller can tell "the target has applied the move"
// (leader == target, epoch >= the committed one) from a stale view.
message SlotLeaderResponse {
  string leader = 1;
  int64 epoch = 2;
}

// DropSlotRequest asks a peer to discard its local copy of one slot (see the
// DropSlot RPC). node names the caller, for the target's log.
message DropSlotRequest {
  int32 slot = 1;
  string node = 2;
}
message DropSlotResponse {}
