syntax = "proto3";

package pushupes.v1;

option go_package = "pushupes/internal/grpcapi/pushupes/v1;pushupesv1";

// PeerService is the inter-node data plane. It is served on the SAME port
// as the Raft transport (the peer port): the connection demux routes the
// HTTP/2 preface (first byte 'P') here and every other first byte to
// Raft. All node-to-node communication — replication fetch, LEO progress,
// migration forwarding/segments/snapshot, liveness probing and address
// registration — rides this one gRPC surface; the admin port is
// management-only.
service PeerService {
  // Ping is the liveness probe (controller failover).
  rpc Ping(PingRequest) returns (PingResponse);
  // Register announces a node's admin/client addresses into the routing
  // table (leader commits an OpRegister; non-leaders relay).
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // MFetch is the multiplexed replica fetch: every slot this follower
  // copies from the serving leader is one item; the call long-polls when
  // everything is empty (wait_ms budget, server-held).
  rpc MFetch(MFetchRequest) returns (MFetchResponse);
  // ReplicaProgress reports follower LEOs in bulk after a productive round.
  rpc ReplicaProgress(ReplicaProgressRequest) returns (ReplicaProgressResponse);
  // Replicate pushes one leader-assigned record to the migration target
  // during the forwarding window (idempotent at seq).
  rpc Replicate(ReplicateRequest) returns (ReplicateResponse);
  // SlotLeo answers a single slot's log end offset (migration catch-up).
  rpc SlotLeo(SlotLeoRequest) returns (SlotLeoResponse);
  // PushSegments streams sealed WAL segments of a slot into the importing
  // node (migration snapshot step) in bounded messages — the source never
  // holds a whole segment in memory.
  rpc PushSegments(stream PushSegmentsRequest) returns (PushSegmentsResponse);
  // TriggerSnapshot asks this node, as migration source, to push its
  // sealed segments of a slot to the target.
  rpc TriggerSnapshot(TriggerSnapshotRequest) returns (TriggerSnapshotResponse);
}

message PingRequest {}
message PingResponse { string node = 1; }

message RegisterRequest {
  string id = 1;
  string admin_addr = 2;  // management HTTP base (scheme carried)
  string client_addr = 3; // client-facing gRPC base (scheme carried)
}
message RegisterResponse {}

// FetchItem: response entries only (requests use packed parallel arrays in
// MFetchRequest). ReplicaProgress reuses slot/from_seq for durable positions.
// payload is raw concatenated WAL record bytes (length-prefixed frames),
// never re-encoded.
message FetchItem {
  int32 slot = 1;
  uint64 from_seq = 2;
  uint64 next_seq = 3;
  bytes payload = 4;
}

message MFetchRequest {
  string follower = 1;
  int64 wait_ms = 2;
  // Packed parallel positions: slot[i] wanted from from_seqs[i].
  // Scalar arrays (not messages): a session carries every followed slot
  // each round, and per-entry FetchItem objects dominated the wire cost.
  repeated int32 slots = 3 [packed = true];
  repeated uint64 from_seqs = 4 [packed = true];
  // sweep marks the periodic liveness round: the leader refreshes the
  // replica last-seen stamps for EVERY reported position. Ordinary rounds
  // record only positions that actually moved (see progressBatch.stamp).
  bool sweep = 5;
}
message MFetchResponse {
  string follower = 1;
  repeated FetchItem items = 2;
}

message ReplicaProgressRequest {
  string follower = 1;
  // Packed durable positions (from_seq = LEO+1), same shape as MFetch.
  repeated int32 slots = 2 [packed = true];
  repeated uint64 from_seqs = 3 [packed = true];
  // stamp: refresh last-seen for every entry (liveness), not only moved
  // ones. False = record only positions that actually changed.
  bool stamp = 4;
}
message ReplicaProgressResponse {}

message ReplicateRequest {
  int32 slot = 1;
  uint64 seq = 2;
  bytes payload = 3; // one encoded record
}
message ReplicateResponse {}

message SlotLeoRequest { int32 slot = 1; }
message SlotLeoResponse { uint64 leo = 1; }

// PushSegmentsRequest is one message of the snapshot stream: the first
// message of a file carries its name and total size (header bytes included),
// following messages carry data only. A new name starts a new file.
message PushSegmentsRequest {
  int32 slot = 1;
  string name = 2;    // set on the first chunk of each segment file
  uint64 size = 3;    // total bytes of the file, set with name
  bytes data = 4;     // file bytes; stream order, chunk sizes bounded
}
message PushSegmentsResponse {}

message TriggerSnapshotRequest {
  int32 slot = 1;
  string to_node = 2;
}
message TriggerSnapshotResponse {}
